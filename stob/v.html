<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="行程">
<title>行程</title>
<style>:root{--bg:#f3f6f5;--card:#fff;--ink:#1c2529;--mut:#5f7075;--line:#dce6e6;--acc:#146c72;--hd:#0f4c52;--hdt:#f3f6f5;--hdm:#cfe2e1;--tag:#e8a93a;--tagt:#3a2806}
@media (prefers-color-scheme:dark){:root{--bg:#101719;--card:#182124;--ink:#ecf2f3;--mut:#9cadb1;--line:#2a373b;--acc:#5ec2c0;--hd:#0f4c52}}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;font:16px/1.65 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
header{background:var(--hd);color:var(--hdt);padding:calc(env(safe-area-inset-top,0px) + 1.6rem) 1.2rem 1.4rem}header .w,main{max-width:760px;margin:0 auto}
.brand{display:inline-block;background:var(--tag);color:var(--tagt);font-size:.72rem;letter-spacing:.14em;padding:.1rem .6rem;border-radius:.25rem .8rem .8rem .25rem;transform:rotate(-4deg)}
h1{margin:.6rem 0 .3rem;font-size:1.95rem;line-height:1.25;letter-spacing:.03em}header p{margin:0;color:var(--hdm);font-size:.95rem}
main{padding:0 .9rem 3rem}.dash{margin-top:-3rem}
.cd{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1rem 1.15rem;box-shadow:0 10px 26px -18px rgb(0 0 0/.35)}.cd span{color:var(--mut);font-size:.88rem}.cd b{display:block;font-size:2.4rem;line-height:1.15;color:var(--acc);letter-spacing:.02em}.cd small{color:var(--mut)}
.today[hidden]{display:none}.today{display:inline-block;margin-top:.6rem;padding:.35rem .9rem;border-radius:999px;background:var(--tag);color:var(--tagt);text-decoration:none;font-size:.88rem;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}.tile{display:flex;flex-direction:column;gap:.1rem;background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.75rem .9rem;color:inherit;text-decoration:none;min-width:0}
.tile span{font-size:.8rem;color:var(--mut)}.tile b{font-size:1.05rem}.tile small{font-size:.8rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump{position:sticky;top:0;z-index:5;display:flex;gap:.35rem;overflow-x:auto;margin:0 -.9rem;padding:calc(env(safe-area-inset-top,0px) + .5rem) .9rem .5rem;background:var(--bg);border-bottom:1px solid var(--line)}
.jump a{flex:0 0 auto;display:flex;align-items:center;gap:.3rem;padding:.35rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:.88rem}.jump small{color:var(--mut);font-size:.75rem}.jump a:focus-visible,.jump a:hover{border-color:var(--acc);color:var(--acc)}
section{scroll-margin-top:3.8rem}h2{display:flex;align-items:center;gap:.45rem;font-size:1.25rem;margin:1.9rem .2rem .7rem;color:var(--acc)}
.card,.day{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.05rem;margin-bottom:.75rem}h3{margin:.15rem 0 .35rem;font-size:1.15rem;line-height:1.4}
.ch{display:flex;justify-content:space-between;gap:.5rem;align-items:center;font-size:.85rem;color:var(--mut)}.tag{flex:0 0 auto;white-space:nowrap;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);border-radius:999px;padding:.05rem .6rem;font-weight:600}
.fly{display:flex;align-items:center;gap:.6rem;margin:.5rem 0}.fly div{flex:1}.fly .r{text-align:right}.fly b{display:block;font-size:1.6rem;line-height:1.2}.fly small{color:var(--mut)}.fly i{font-style:normal;color:var(--acc)}
.sub{border-top:1px dashed var(--line);margin-top:.6rem;padding-top:.6rem}.kv{display:flex;justify-content:space-between;gap:.8rem;padding:.15rem 0}.kv span{color:var(--mut);font-size:.88rem}.kv b{font-size:1.02rem;letter-spacing:.04em;text-align:right;overflow-wrap:anywhere;user-select:all}
.ppl{font-size:.9rem;margin:.1rem 0 .3rem}.mut{color:var(--mut);font-size:.88rem}.addr{font-size:.9rem;margin:.3rem 0}.warn{color:#c2410c;font-size:.86rem}.room{margin:.35rem 0}
.btn{display:inline-block;margin:.4rem 0 .2rem;padding:.4rem .95rem;border-radius:999px;background:var(--acc);color:var(--card);text-decoration:none;font-size:.88rem}
.route{font-weight:600;margin:.2rem 0}.route small{margin-left:.5rem;color:var(--mut);font-weight:400}ul{margin:.4rem 0;padding-left:1.2rem}li{margin:.2rem 0}.lead{margin:0 .2rem 1rem;color:var(--mut)}
.day{padding:.85rem 1rem}.day summary{display:flex;gap:.8rem;align-items:flex-start;cursor:pointer;list-style:none}.day summary::-webkit-details-marker{display:none}
.dn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border-radius:50%;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-weight:700;font-size:.9rem}
.dsm{flex:1;min-width:0}.dsm b{display:block}.ol{display:block;font-size:.88rem;color:var(--ink);opacity:.85;margin:.15rem 0}.ol i{font-style:normal;color:var(--acc);margin:0 .3rem}.dsm small{display:block;color:var(--mut);font-size:.82rem}
.chev{flex:0 0 auto;width:.6rem;height:.6rem;margin-top:.9rem;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s}.day[open] .chev{transform:rotate(-135deg)}
.day.now{border-color:var(--tag);box-shadow:0 0 0 2px color-mix(in srgb,var(--tag) 45%,transparent)}.dbody{margin-top:.75rem;padding-top:.5rem;border-top:1px solid var(--line)}
.it{display:flex;gap:.7rem;padding:.45rem 0;align-items:flex-start}.it>div{flex:1;min-width:0}.it p{margin:.1rem 0;color:var(--mut);font-size:.92rem}.it small{color:var(--mut)}
.tm{flex:0 0 3.4rem;text-align:center;font-size:.82rem;font-weight:700;border-radius:.4rem;padding:.12rem 0;background:color-mix(in srgb,var(--acc) 11%,transparent);color:var(--acc)}.bk .tm{background:var(--acc);color:var(--card)}
.it em{font-style:normal;font-size:.72rem;margin-left:.4rem;padding:.05rem .45rem;border-radius:999px;background:color-mix(in srgb,var(--tag) 35%,transparent)}.mv{margin-left:4.1rem;font-size:.8rem;color:var(--mut)}.pin{text-decoration:none;font-size:1.1rem}
.tips li{margin:.35rem 0}footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1rem 1rem 2.5rem}footer button{margin:.6rem .2rem 0;padding:.4rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}
@media print{.jump,.today,footer button,.btn,.pin{display:none}header{background:none;color:#000;padding:0 0 1rem}header p{color:#444}.dash{margin-top:0}.card,.day{break-inside:avoid;border-color:#ccc;box-shadow:none}body,html{background:#fff}}

#msg{max-width:560px;margin:3rem auto;padding:1.2rem;border:1px solid var(--line);border-radius:1rem;background:var(--card);color:var(--ink);font-size:.95rem}
</style></head><body><div id="app"></div><p id="msg" hidden></p><script src="v.js"></script></body></html>
