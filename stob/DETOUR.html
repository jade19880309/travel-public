/* 分享版：沒有任何內建資料，全部從每個人自己的雲端資料讀取（見檔尾 cloud script） */

 return{k:0,t:'⏰ 尚未開放，還有 '+(dd?dd+' 天 ':'')+hh+' 小時開放',c:dl<=3*864e5?RED:'text-stone-500'}};

function remBox(){const now=Date.now(),W=7*864e5,agg=new Map();
 const add=(ts,when,kind,txt,act)=>{const k=kind+'|'+txt+'|'+when;if(agg.has(k))agg.get(k).n++;else agg.set(k,{ts,when,kind,txt,act,n:1})};
 const dw=x=>{const n=dayD(x);return d(x).slice(5)+'（週'+WD[pd(x).getDay()]+'）'+(n==0?'今天':n==1?'明天':n+' 天後')};
 db.ht.filter(h=>h.status!='已取消').forEach(h=>{const nm=(h.zh||h.en),a=`go('ht','${h.id}')`;
  if(okH(h)&&!h.paid&&!upIsPaid(h.id)&&h.payDate){const n=dayD(h.payDate);if(n>=0&&n<=7)add(new Date(h.payDate).getTime(),dw(h.payDate),'住宿付款',nm,a)}
  if(h.cancelBy){const n=dayD(h.cancelBy);if(n>=0&&n<=7)add(new Date(h.cancelBy).getTime()+1,dw(h.cancelBy),'免費取消到期',nm,a)}});
 db.tr.filter(x=>x.status!='已取消'&&!x.paid).forEach(x=>(x.pays||[]).forEach((q,qi)=>{if(q.paid||upIsPaid(x.id+'#'+qi))return;const n=dayD(q.d);if(n>=0&&n<=7)add(new Date(q.d).getTime()+2,dw(q.d),'其他付款',(x.title||x.type+' '+x.company)+'・'+q.l+'・'+money(q.amt,x.cur),`go('tr','${x.id}')`)}));
 const seen=new Set();db.fl.filter(f=>f.status!='已取消').forEach(f=>f.segs.forEach(s=>{if(s.dir=='預期不飛')return;const a=ciAir(s.airline||f.airline),ms=segMs(s);if(!a||ms==null)return;const key=a.name+s.no+s.date;if(seen.has(key))return;seen.add(key);const o=ms-a.open*36e5,c=ms-a.close*36e5;if(now>=c||o-now>W)return;const z=ciZ(s);
  add(Math.max(o,now),o<=now?'現在':fmtL(o,z[1]).slice(5),'自助報到',a.name+' '+s.no+'（'+d(s.date).slice(5)+' 起飛）'+(o<=now?'・請於 '+fmtL(c,z[1]).slice(5)+' 前完成':''),`go('fl','${f.id}')`)}));
 const items=[...agg.values()].sort((x,y)=>x.ts-y.ts);

function shToPng(el){return new Promise((ok,no)=>{
 /* SVG 圖片裡用不到網頁載入的 Noto 字型，所以先在畫面外用「系統字型」重新排版再量尺寸，兩邊字寬才會一致 */
 const W=Math.ceil(el.getBoundingClientRect().width),sc=Math.min(3,Math.max(2,devicePixelRatio||2));
 const host=document.createElement('div');host.setAttribute('aria-hidden','true');

 const cl=el.cloneNode(true);cl.removeAttribute('id');host.appendChild(cl);el.parentNode.appendChild(host);
 const SANS='"PingFang TC","Heiti TC","Microsoft JhengHei",-apple-system,system-ui,sans-serif',SERIF='serif';
 const all=[cl,...cl.querySelectorAll('*')];
 all.forEach(n=>{const f=getComputedStyle(n).fontFamily;n.style.fontFamily=/Noto Serif TC|Songti/.test(f)?SERIF:SANS});
 cl.style.margin='0';cl.style.boxShadow='none';cl.style.borderRadius='0';cl.style.border='0';const hd=cl.querySelector('.sx-h');if(hd)hd.style.paddingTop='104px';cl.style.width=W+'px';cl.style.boxSizing='border-box';
 const H=Math.ceil(cl.getBoundingClientRect().height);
 const baked=all.map(n=>{const cs=getComputedStyle(n);let t='';for(let k=0;k<cs.length;k++){const q=cs[k];if(q.indexOf('-webkit-text-fill')==0||q.indexOf('-webkit-text-stroke')==0)continue;t+=q+':'+cs.getPropertyValue(q)+';'}return t});all.forEach((n,i)=>n.setAttribute('style',baked[i]));
 const xml=new XMLSerializer().serializeToString(cl);host.remove();
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="100%" height="100%">'+xml+'</foreignObject></svg>';
 const im=new Image();
 im.onload=()=>{try{
  const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png')}catch(e){no(e)}};
 im.onerror=()=>no(new Error('img'));
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}

const mAddD=(s,n)=>{const [y,m,d]=s.split('-').map(Number),t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
/* 每日總房間數：把勾選的訂單逐晚加總，連續且房數相同的日子併成一段 */
function dRooms(hs,L){const B=LB[L],c=CL(L),cnt={};
 hs.forEach(h=>{if(!h.cin||!h.cout||h.cout<=h.cin)return;const n=(h.rooms||[]).length;for(let d=h.cin,i=0;d<h.cout&&i<400;d=mAddD(d,1),i++)cnt[d]=(cnt[d]||0)+n});
 const ds=Object.keys(cnt).sort();if(!ds.length)return [];
 const sh=s=>mDate(s,L,1).replace(/[ \/]\d{4}$/,''),runs=[];
 ds.forEach(d=>{const r=runs[runs.length-1];if(r&&r.n==cnt[d]&&mAddD(r.b,1)==d)r.b=d;else runs.push({a:d,b:d,n:cnt[d]})});
 const bl=L=='ja'||isZh(L)?'・':'- ';
 return ['',`${B.dr}${c}`.trim(),...runs.map(r=>`${bl}${r.a==r.b?sh(r.a):sh(r.a)+'–'+sh(r.b)}${c}${B.rms(r.n)}`)]}
function dHotel(v,L){const B=LB[L],c=CL(L),hs=mOn(v),h0=hs[0],same=hs.every(h=>h.cin==h0.cin&&h.cout==h0.cout),o=[`${B.hotel}${c}${hName(h0,L)}`];
 const dt=h=>[h.cin?`${B.cin}${c}${mDate(h.cin,L)}`:'',h.cout?`${B.cout}${c}${mDate(h.cout,L)}${PR(L,B.nt(nights(h)))}`:''].filter(Boolean);
 if(same)o.push(...dt(h0));
 hs.forEach((h,i)=>{o.push('');if(hs.length>1)o.push(`■ ${B.ord(i+1)}`);if(!same)o.push(...dt(h));
  if(h.platform)o.push(`${B.site}${c}${siteN(h.platform,L)}`);if(h.orderNo)o.push(`${B.no}${c}${h.orderNo}`);
  h.rooms.forEach((r,j)=>{const m=M(r.members.includes(h.rep)?h.rep:r.members.find(M)),n=r.members.filter(M).length;
   o.push(`${B.room(j+1)}${c}${[rType(r.type,L),n?B.gs(n):'',r.bf?B.bf1:B.bf0].filter(Boolean).join(' / ')}`)})});
 o.push(...dRooms(hs,L));return o}
const pLine=(ls,k)=>{const s=(ls||[]).find(t=>t.startsWith(k));if(!s)return null;const m=s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}:\d{2}))?/),p=s.split('・').slice(1).join('・');
 return {d:m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'',t:m&&m[4]||'',p}};
function dOther(v,L){const B=LB[L],c=CL(L),xs=mOn(v),o=[`${B.co}${c}${vName(v,L)}`];
 xs.forEach((x,i)=>{o.push('');if(xs.length>1)o.push(`■ ${B.ord(i+1)}`);
  if(isZh(L)&&x.title)o.push(x.title);
  if(x.platform)o.push(`${B.site}${c}${siteN(x.platform,L)}`);if(x.orderNo)o.push(`${B.no}${c}${x.orderNo}`);if(x.code)o.push(`${B.code}${c}${x.code}`);
  if(v.kind=='car'){[['取車',B.pick,x.date,x.dep,x.from],['還車',B.ret,'',x.arr,x.to]].forEach(([k,l,d0,t0,p0])=>{const q=pLine(x.lines,k)||{},dd=q.d||d0,tt=q.t||t0,pp=q.p||p0;
    if(dd||tt)o.push(`${l}${c}${[mDate(dd,L),tt,isZh(L)?pp:''].filter(Boolean).join(' ')}`)})}
  else{if(x.date)o.push(`${B.date}${c}${mDate(x.date,L)}`);if(x.dep)o.push(`${B.time}${c}${x.dep}`)}
  const ps=Object.keys(x.pax||{}).filter(M);if(ps.length)o.push(`${B.pax}${c}${B.ppl(ps.length)}`);if(ps.length)o.push(`${B.rn}${c}${mWho(M(ps[0]),L)}`)});
 return o}

  :`<span>${esc(CLD.msg)}</span><button type="button" onclick="cloudReload()">重新讀取</button>`}
/* 寫入前的守門：鎖定或沒有登入時不讓改，也不在畫面上假裝改好了 */
function canWrite(){if(CLD.lock){tip('目前暫停儲存，請先按上方「重新讀取」');lockUpd();return false}if(!CLD.db||!CLD.uid){tip(CLD.msg||'請先登入 Claude');return false}return true}
function cloudSave(){famCalc();campCalc();CLD.dirty=true;if(!CLD.db||!CLD.uid){CLD.st='off';return}if(CLD.lock){badgeUpd();return}CLD.st='save';badgeUpd();clearTimeout(CLD.timer);CLD.timer=setTimeout(cloudFlush,500)}
async function readMain(){const s=await uref('tob').get();return s.exists?(s.data()||{}):null}
/* 分段文件的前綴：新格式寫在主文件 pk；沒有 pk 的 v2 用 tob_r<rev>_p；舊格式用 tob_p */
const partPre=o=>{const p=o&&o.pk;if(typeof p=='string'&&/^tob_[A-Za-z0-9_]{1,80}$/.test(p))return p;return o&&o.rev?'tob_r'+o.rev+'_p':'tob_p'};
/* 寫入鎖：只用 Claude db 提供的 acquire（cooperative lease，所有 STOB 寫入者都先取得它）。
   沒拿到就不寫；不支援 acquire 就暫停儲存，不再「當作成功」。 */
const LEASE_MS=10000,LEASE_MIN=4000;
async function leaseTry(){const r=uref('tob_lock');if(typeof r.acquire!='function')throw {code:'nolease'};
 const t0=Date.now();let a;try{a=await r.acquire({holder:CLD.sid,ttlMs:LEASE_MS})}catch(e){const c=e&&e.code;if(c=='capability_removed'||c=='capability_disabled')throw {code:'nolease'};throw e}
 if(a&&a.acquired){CLD.leaseUntil=t0+LEASE_MS;return {ok:true}}
 const ex=a&&a.expiresAt?Date.parse(a.expiresAt)-Date.now():NaN;return {ok:false,wait:isFinite(ex)?Math.min(4000,Math.max(300,ex+200)):1200}}
async function takeLease(){for(let i=0;i<4;i++){let r;try{r=await leaseTry()}catch(e){if(e&&e.code=='unavailable'&&i<3){await sleep(600+Math.random()*900);continue}throw e}
  if(r.ok)return;await sleep(r.wait)}
 throw {code:'busy'}}
/* 每次寫入前確認鎖還夠用（剩不到 4 秒就續約；續不到就中止，主文件不會被寫） */
async function keepLease(){if(CLD.leaseUntil-Date.now()>LEASE_MIN)return;const r=await leaseTry();if(!r.ok)throw {code:'lease_lost'}}
function cloudFlush(){
 CLD.q=CLD.q.then(async()=>{if(CLD.lock)return;
  await takeLease();
  const m=await readMain(),remote=m?(+m.rev||0):0,P=CLD.pend;
  if(remote!==CLD.rev){
   /* 上次寫主文件時斷線、其實已寫入：主文件是自己寫的同一份 → 接手，不算衝突 */
   if(P&&m&&m.by===CLD.sid&&remote===P.rev&&m.h===P.h){CLD.rev=P.rev;CLD.prevN=P.n;CLD.legacy=false;const op=CLD.pk;CLD.pk=P.pk;CLD.pend=null;for(let i=1;i<P.oldN;i++)uref(op+i).delete().catch(()=>{})}
   else throw {code:'conflict'}}
  const js=JSON.stringify(db),h=fnv(js);
  if(m&&!CLD.legacy&&m.h===h&&+m.len===js.length){CLD.dirty=false;CLD.retry=0;CLD.st='ok';badgeUpd();return}
  const parts=[];for(let i=0;i<js.length;i+=PART)parts.push(js.slice(i,i+PART));if(!parts.length)parts.push('{}');
  const rev=CLD.rev+1,pk='tob_r'+rev+'_'+CLD.sid.slice(0,10)+'_p';
  for(let i=1;i<parts.length;i++){await keepLease();await uref(pk+i).set({s:parts[i]})}
  await keepLease();
  CLD.pend={rev,h,n:parts.length,pk,oldN:CLD.prevN};
  await uref('tob').set({v:2,rev,n:parts.length,len:js.length,h,pk,t:Date.now(),by:CLD.sid,s:parts[0]});
  /* 寫完再讀一次：如果被沒用鎖的舊版本覆蓋，立刻發現並鎖定 */
  const v=await readMain();if(!v||+v.rev!==rev||v.by!==CLD.sid||v.h!==h)throw {code:'conflict'};
  const op=CLD.pk,oldN=CLD.prevN;CLD.rev=rev;CLD.prevN=parts.length;CLD.legacy=false;CLD.pk=pk;CLD.pend=null;
  for(let i=1;i<oldN;i++)uref(op+i).delete().catch(()=>{});
  CLD.dirty=JSON.stringify(db)!==js;CLD.retry=0;CLD.st='ok';CLD.noWrite=false;badgeUpd()})
 .catch(e=>{const c=e&&e.code;clearTimeout(CLD.timer);
  if(c=='conflict'){CLD.lock='conflict';CLD.st='err';CLD.msg='這份資料在其他裝置或分頁更新過。為了不覆蓋，已暫停儲存；請按「重新讀取」載入最新資料。';badgeUpd();render();return}
  if(c=='nolease'){CLD.lock='nolease';CLD.st='err';CLD.msg='目前的 Claude 版本不支援儲存鎖定，為了避免多台裝置互相覆蓋，已暫停儲存。請更新 Claude App 後重新開啟這個頁面。';badgeUpd();render();return}
  if(c=='busy'||c=='lease_lost'){CLD.st='err';CLD.msg='另一台裝置或分頁正在儲存，稍後自動重試…';badgeUpd();CLD.timer=setTimeout(cloudFlush,4000);return}
  if(c=='unavailable'||c=='resource_exhausted'||!c){CLD.retry=Math.min((CLD.retry||0)+1,5);CLD.st='err';CLD.msg='網路不穩，修改還沒存到雲端；恢復連線後會自動重試。';badgeUpd();if(CLD.retry==1)tip(CLD.msg);CLD.timer=setTimeout(cloudFlush,Math.min(60000,2500*2**CLD.retry));return}
  CLD.st='err';CLD.noWrite=c=='invalid_argument';CLD.msg=c=='quota_exceeded'?'雲端空間已滿，請刪除一些截圖或訂單。':CLD.noWrite?'你目前沒有儲存權限：請分享這個頁面的人把你設為「編輯者」。':'儲存失敗，請確認網路後再改一次（下次修改會再嘗試儲存）。';badgeUpd();tip(CLD.msg)})}
addEventListener('online',()=>{if(CLD.dirty&&!CLD.lock&&CLD.db&&CLD.uid){clearTimeout(CLD.timer);CLD.retry=0;cloudFlush()}});
async function cloudLoad(){const o=await readMain();
 if(!o){applyDb({});CLD.rev=0;CLD.prevN=1;CLD.legacy=false;CLD.pk='tob_p';return}
 const legacy=!o.rev,n=Math.max(1,+o.n||1),pre=partPre(o);let js=String(o.s||'');
 for(let i=1;i<n;i++){const p=await uref(pre+i).get();if(!p.exists)throw {code:'part_missing'};js+=String((p.data()||{}).s||'')}
 if(!legacy&&(js.length!==+o.len||fnv(js)!==o.h))throw {code:'checksum'};
 let d;try{d=JSON.parse(js||'{}')}catch(e){throw {code:'parse'}}
 if(!d||typeof d!='object'||Array.isArray(d))throw {code:'parse'};
 applyDb(d);CLD.rev=legacy?0:+o.rev;CLD.prevN=n;CLD.legacy=legacy;CLD.pk=pre;CLD.pend=null;CLD.dirty=false;
 CLD.imgMiss=0;for(const k of db.imgs){try{const p=await uref('img_'+ikey(k)).get();if(p.exists)ORDIMG[k]=String((p.data()||{}).d||'');else CLD.imgMiss++}catch(e){CLD.imgMiss++}}}
const LOADERR={part_missing:'資料不完整（可能另一台裝置正在儲存）',checksum:'資料檢查碼不符',parse:'資料格式損壞'};
async function loadSafe(){for(let i=0;i<2;i++){try{await cloudLoad();CLD.lock='';return true}catch(e){if(i==0){await sleep(1500);continue}
  CLD.lock='read';CLD.st='err';CLD.msg='讀取雲端資料失敗（'+(LOADERR[e&&e.code]||'網路或服務暫時無法使用')+'）。為了避免覆蓋你的資料，已暫停儲存；請按「重新讀取」。';return false}}}
/* 重新讀取前先確認：會放棄這台裝置沒存上雲端的修改 */
async function cloudReload(ok){if(!ok){CLD.rconf=true;lockUpd();return}
 CLD.rconf=false;CLD.st='load';CLD.lock='';badgeUpd();lockUpd();clearTimeout(CLD.timer);await CLD.q.catch(()=>{});
 Object.keys(ORDIMG).forEach(k=>delete ORDIMG[k]);const okk=await loadSafe();if(okk){CLD.st='ok';CLD.retry=0;tip('已載入最新資料')}badgeUpd();render()}
const ikey=k=>String(k).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,150)||'x';
/* 訂單截圖：失敗要讓使用者知道，並可重試 */
function imgSave(k,dataUrl){if(!k)return;if(!dataUrl){imgFail(k,'',"截圖太大，壓縮後仍超過上限");return}
 if(!CLD.db||!CLD.uid||CLD.lock){imgFail(k,dataUrl,CLD.lock?'目前暫停儲存':'未登入');return}
 ORDIMG[k]=dataUrl;if(!db.imgs.includes(k))db.imgs.push(k);
 CLD.q=CLD.q.then(()=>uref('img_'+ikey(k)).set({k,d:dataUrl})).then(()=>{ADS.imgFail=ADS.imgFail.filter(x=>x.k!=k)}).catch(e=>{delete ORDIMG[k];db.imgs=db.imgs.filter(x=>x!=k);imgFail(k,dataUrl,e&&e.code=='quota_exceeded'?'雲端空間已滿':'雲端儲存失敗');cloudSave()})}
function imgFail(k,d,why){ADS.imgFail=ADS.imgFail.filter(x=>x.k!=k);ADS.imgFail.push({k,d,why});clearTimeout(ADS.imgT);ADS.imgT=setTimeout(()=>{tip(ADS.imgFail.length+' 張訂單截圖沒有存到雲端，請到「上傳訂單」頁查看');if(S.v=='up')render()},300)}
function imgRetry(){const L=ADS.imgFail.filter(x=>x.d);if(!L.length||!canWrite())return;L.forEach(x=>imgSave(x.k,x.d));CLD.q.then(()=>{cloudSave();render();tip(ADS.imgFail.length?'還有 '+ADS.imgFail.length+' 張沒存到':'截圖都已存到雲端')})}
function imgDel(k){if(!k||!db.imgs.includes(k))return;delete ORDIMG[k];db.imgs=db.imgs.filter(x=>x!=k);if(CLD.db)CLD.q=CLD.q.then(()=>uref('img_'+ikey(k)).delete()).catch(()=>{})}

function dtrAppear(){const cur=dtrTheme();return `<div class="${CC}"><div class="font-bold mb-1">外觀設定<\/div><p class="text-sm text-stone-500 mb-3">選擇偏航的風格。只記在這支裝置的瀏覽器，不會同步到帳號。<\/p><div class="dtr-th" role="radiogroup" aria-label="外觀主題">${Object.keys(DTR_TH).map(k=>`<button type="button" role="radio" aria-checked="${k==cur}" class="dtr-tb dtr-${k}" onclick="dtrSetTheme('${k}')"><span class="dtr-sw"><i><\/i><i><\/i><i><\/i><\/span><b>${DTR_TH[k].n}${k==cur?'・使用中':''}<\/b><small>${DTR_TH[k].d}<\/small><\/button>`).join('')}<\/div><\/div>`}
function dtrHero(){return `<section class="dtr-hero"><div class="dtr-fl" aria-hidden="true"><span class="th-r"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" fill="none"><path d="M15 205C155 205 241 183 323 121S463 77 527 40" stroke="#C9A06A" stroke-width="3" stroke-linecap="round"/><path d="m512 43 65-25-25 57-14-26-26-6Z" fill="#7A1F2C"/><path d="m538 49 39-31-25 57-14-26Z" fill="#A84D5A"/><\/svg><\/span><span class="th-n"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" fill="none"><path d="M15 205C155 205 241 183 323 121S463 77 527 40" stroke="#D6B273" stroke-width="3" stroke-linecap="round"/><path d="m512 43 65-25-25 57-14-26-26-6Z" fill="#F7F4E9"/><path d="m538 49 39-31-25 57-14-26Z" fill="#D6B273"/><\/svg><\/span><\/div><div class="dtr-g">夜色溫柔，把想去的地方收進口袋。<\/div><div class="dtr-t">我們計畫了遠方，<br>卻愛上了<em>沿途<\/em>。<\/div><div class="dtr-en">All planned. Free to wander.<\/div><\/section>`}
function dtrFoot(){return `<div class="dtr-foot">${DTR_ST}<p>一切都安排好了，現在可以亂來了。<\/p><button type="button" class="dtr-ver" onclick="ADS.tab='ab';go('add')">DETOUR・v${DTR_V.current}<\/button><\/div>`}

 <ul class="dtr-vr">${DTR_V.history.map((h,i)=>`<li${i?'':' class="cur"'}><details${i?'':' open'}><summary><b>v${h.v}<\/b>${esc(h.t)}<small>${esc(h.d)}<\/small><\/summary><ul>${h.n.map(x=>`<li>${esc(x)}<\/li>`).join('')}<\/ul><\/details><\/li>`).join('')}<\/ul><\/div>`}

(async function boot(){
 if(!window.claude||!claude.use){CLD.st='off';CLD.msg='請在 Claude 裡開啟這個頁面。';render();return}
 const to=setTimeout(()=>{if(CLD.st=='load'){CLD.st='off';CLD.msg='讀不到雲端資料：請確認已登入 Claude、網路正常。';render()}},12000);
 try{const [dbx,us]=await Promise.all([claude.use('db'),claude.use('user')]);CLD.db=dbx;CLD.user=us;CLD.uid=us?await us.id():'';
  if(!dbx||!CLD.uid){clearTimeout(to);CLD.st='off';CLD.msg='請先登入 Claude，才能儲存你自己的訂單。';render();return}
  const ok=await loadSafe();clearTimeout(to);if(ok)CLD.st='ok';route();lockUpd()}
 catch(e){clearTimeout(to);CLD.lock='read';CLD.st='err';CLD.msg='雲端資料讀取失敗。為了避免覆蓋你的資料，已暫停儲存；請按「重新讀取」。';render();lockUpd()}
 try{CLD.sample=await claude.use('sample');if(CLD.sample)CLD.lim=await CLD.sample.limits().catch(()=>null)}catch(e){CLD.sample=null}
 if(S.v=='add'||S.v=='up')render()})();

{const _home=VIEWS.home;VIEWS.home=()=>{const warn=CLD.st=='off'||CLD.st=='err'?`<div class="${CC} cldw">${esc(CLD.msg||'目前無法使用雲端資料')}</div>`:'';

function loadScr(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function pdfLib(){if(window.pdfjsLib)return window.pdfjsLib;const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScr(B+'pdf.min.js');await loadScr(B+'pdf.worker.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';return window.pdfjsLib}
async function pdfPages(file,max){const lib=await pdfLib(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
 for(let p=1;p<=Math.min(doc.numPages,max);p++){const pg=await doc.getPage(p),vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(c)}return out}
function fileCanvas(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(u);ok(c)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};im.src=u})}
function scaled(c,max){const k=Math.min(1,max/Math.max(c.width,c.height));if(k>=1)return c;const o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(c.height*k);const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);return o}
const toBlob=(c,t,q)=>new Promise(ok=>c.toBlob(ok,t,q));
function thumb(c){for(const [m,q] of [[1100,.6],[900,.5],[720,.45],[560,.4]]){const u=scaled(c,m).toDataURL('image/webp',q);if(u.length<185000)return u}return ''}

const AI_RULES=`你是旅遊訂單整理助手。從使用者提供的訂單截圖、PDF 或確認信文字中，抽出訂單資料，整理成下面格式的 JSON（只回傳 JSON）。

規則：
- 日期一律 YYYY-MM-DD，時間 HH:MM（24 小時制，當地時間）。金額是數字、不加逗號；幣別用 ISO 代碼（TWD JPY KRW HKD CNY USD EUR THB MOP…）。
- 看不到的欄位填空字串，不要猜、不要編造。不要記錄完整信用卡號（最多末四碼）。
- 一個訂單編號一筆訂單；同一筆來回機票放在同一筆的 segs 裡。
- note 用繁體中文，重點以「・」分隔：付款方式、取消規則、早餐、注意事項等。
- 旅客：若和「現有成員」是同一人（比對英文姓名或中文名），用他的 id；否則在 members 新增，ref 用 "p1"、"p2"…。英文姓名分成 last（姓）和 first（名），全大寫、照護照拼法。
- 旅程：若訂單日期落在「現有旅程」期間（或補充說明有指定），trip 用那個旅程的 id；否則在 trips 新增，ref 用 "new1"…，name 用「國家／城市」簡短命名（例如「日本東京」），start/end 依訂單推算。
- img：這筆訂單出現在第幾張圖片（從 0 開始的陣列），沒有圖片就給 []。

  const o=obj(r);if(!arr(o.orders).length&&!arr(o.members).length&&!arr(o.trips).length){ADS.err='沒有讀到訂單資料，請確認圖片內容，或在補充說明寫清楚。';}
  else{ADS.res={o,thumbs,skip:{}};arr(o.orders).forEach(x=>{if(!x.trip||!(db.trips.some(t=>t.id==x.trip)||arr(o.trips).some(t=>t.ref==x.trip)))x.trip=(arr(o.trips)[0]||{}).ref||(db.trips[0]||{}).id||''})}}

const isMem=i=>db.members.some(m=>m.id==i),isTrip=i=>db.trips.some(t=>t.id==i);
function vField(c,k,v){const D=['dob','ppExp','start','end','cin','cout','cancelBy','cxlAt','payDate','date'];
 if(!FLD[c]||!(k in FLD[c]))return '不認得的欄位';
 const str=()=>typeof v=='string'||typeof v=='number';
 if(D.includes(k))return v===''||(typeof v=='string'&&RE_D.test(v))?'':'日期格式要是 YYYY-MM-DD';
 if(k=='dep'||k=='arr')return v===''||(typeof v=='string'&&RE_T.test(v))?'':'時間格式要是 HH:MM';
 if(k=='total')return v===''||(typeof v=='number'&&isFinite(v)&&v>=0)?'':'金額要是數字';
 if(['paid','free','fam','nosplit'].includes(k))return typeof v=='boolean'||v===0||v===1?'':'要是「是／否」';
 if(k=='status')return ['已確認','待確認','已取消'].includes(v)?'':'狀態只能是 已確認／待確認／已取消';
 if(k=='cur')return typeof v=='string'&&/^[A-Z]{3}$/.test(v)?'':'幣別要是三個大寫英文字母';
 if(k=='sex')return ['','M','F'].includes(v)?'':'性別要是 M、F 或空白';
 if(k=='trip')return isTrip(v)?'':'找不到這趟旅程';
 if(k=='rep')return v===''||isMem(v)?'':'找不到這位成員';
 if(k=='curs')return Array.isArray(v)&&v.every(x=>/^[A-Z]{3}$/.test(x))?'':'外幣要是幣別代碼清單';
 if(k=='lines')return Array.isArray(v)&&v.every(x=>typeof x=='string')?'':'要是文字清單';
 if(k=='pax')return v&&typeof v=='object'&&!Array.isArray(v)&&Object.keys(v).every(isMem)&&Object.values(v).every(x=>x===''||typeof x=='number')?'':'旅客要是現有成員、金額要是數字';
 if(k=='pp')return v&&typeof v=='object'&&!Array.isArray(v)&&Object.keys(v).every(isMem)?'':'旅客要是現有成員';
 if(k=='rooms')return Array.isArray(v)&&v.length&&v.every(r=>r&&typeof r=='object'&&arr(r.members).every(isMem))?'':'房間格式不對或住客不是現有成員';
 if(k=='segs')return Array.isArray(v)&&v.every(s=>s&&typeof s=='object'&&(s.date===undefined||s.date===''||RE_D.test(s.date))&&(!s.dep||RE_T.test(s.dep))&&(!s.arr||RE_T.test(s.arr)))?'':'航段格式不對';
 if(k=='pays')return Array.isArray(v)&&v.every(q=>q&&typeof q=='object'&&(!q.d||RE_D.test(q.d)))?'':'分期付款格式不對';
 if(k=='camp')return v&&typeof v=='object'&&RE_D.test(v.cin||'')&&RE_D.test(v.cout||'')?'':'交通兼住宿要有上車／下車日期';
 return str()?'':'要是文字'}
const fmtV=v=>v===undefined?'（無）':v===''||v===null?'（空白）':typeof v=='boolean'?(v?'是':'否'):typeof v=='object'?JSON.stringify(v).slice(0,90)+(JSON.stringify(v).length>90?'…':''):String(v);
const itemName=(c,x)=>!x?'':c=='members'?(x.zh||[x.last,x.first].filter(Boolean).join(' ')):c=='trips'?String(x.name||'').replace(/^\d{6}/,''):ttlOf(c,x);
function aiCheck(ops){return arr(ops).slice(0,60).map((o,i)=>{o=obj(o);const c=o.coll,L=db[c],r={i,op:o.op,c,rows:[],err:'',name:''};
 if(!AIK.includes(c)){r.err='不認得的資料類別';return r}
 if(o.op=='set'){const x=L.find(y=>y.id==o.id);if(!x){r.err='找不到要修改的項目';return r}r.name=itemName(c,x);const P=obj(o.patch);
  if(!Object.keys(P).length){r.err='沒有要改的欄位';return r}
  Object.entries(P).forEach(([k,v])=>{const e=k=='id'?'不能修改 id':vField(c,k,v);r.rows.push({k,l:(FLD[c]||{})[k]||k,a:x[k],b:v,e})});
  if(r.rows.some(x=>x.e))r.err='有欄位沒通過檢查';r.id=o.id;r.patch=P;return r}
 if(o.op=='add'){const it=obj(o.item);delete it.id;r.name=itemName(c,it)||'（新項目）';
  Object.entries(it).forEach(([k,v])=>{const e=vField(c,k,v);r.rows.push({k,l:(FLD[c]||{})[k]||k,a:undefined,b:v,e})});
  if(c=='trips'&&!(it.name&&RE_D.test(it.start||'')))r.err='新旅程要有名稱和出發日期';else if(c=='members'&&!(it.zh||it.last))r.err='新成員要有姓名';else if(COLL.includes(c)&&!isTrip(it.trip))r.err='新訂單要指定現有旅程';else if(r.rows.some(x=>x.e))r.err='有欄位沒通過檢查';
  r.item=it;return r}
 if(o.op=='del'){const x=L.find(y=>y.id==o.id);if(!x){r.err='找不到要刪除的項目';return r}r.name=itemName(c,x);r.id=o.id;return r}
 r.err='不認得的動作';return r})}
function adAiBox(){if(!CLD.sample||!db.trips.length&&!db.members.length)return '';const r=ADS.aiRes;

 return `<div class="${CC}"><div class="font-bold">💬 用一句話修改</div><p class="text-sm text-stone-500 mb-2">例如「京都那間飯店改成已付款」「把小明加到東京所有訂單」「旅程改名叫北海道親子遊」。</p>

 ${r?`<div class="aipv"><div class="text-sm font-medium">${esc(r.summary||'')}</div>${L.length?`<div class="text-xs text-stone-500 mb-1">請逐項確認，只會套用勾選的項目</div>${L.map(card).join('')}
  <div class="adbar"><button type="button" class="${BP}" ${nSel?'':'disabled'} onclick="aiApply()">套用勾選的 ${nSel} 項</button><button type="button" class="${BT}" onclick="ADS.aiRes=null;render()">取消</button></div>`:'<div class="text-xs text-stone-500">沒有要修改的內容</div>'}</div>`:''}
 ${ADS.aiErr?`<div class="text-sm text-red-700 mt-2">${esc(ADS.aiErr)}</div>`:''}</div>`}
async function aiEdit(){const q=ADS.ai.trim();if(!q||ADS.busy)return;ADS.busy=true;ADS.aiErr='';ADS.aiRes=null;render();
 const data={members:db.members,trips:db.trips,fl:db.fl,ht:db.ht,tr:db.tr,ot:db.ot};
 const p=`你在幫忙修改一份旅遊訂單資料（JSON）。依照使用者的要求，回傳要做的變更，只回傳 JSON：
{"summary":"用繁體中文一句話說明會改什麼（如果不清楚要改哪一筆，說明原因並給空的 ops）","ops":[
 {"op":"set","coll":"members|trips|fl|ht|tr|ot","id":"項目 id","patch":{"欄位":"新值"}},
 {"op":"add","coll":"…","item":{…完整新項目，不用給 id…}},
 {"op":"del","coll":"…","id":"…"}]}
patch 只放要改的欄位（陣列、物件欄位要給完整的新內容），只能用資料裡已有的欄位名稱。不要改動使用者沒提到的資料。日期 YYYY-MM-DD，時間 HH:MM，金額用數字，是／否用 true／false，status 只能是 已確認／待確認／已取消，旅程與成員只能用現有的 id。

今天：${new Date().toLocaleDateString('sv-SE')}
使用者要求：${q}

目前資料：
${JSON.stringify(data).slice(0,200000)}`;
 try{ADS.ctl=new AbortController();const r=await CLD.sample.json(p,{signal:ADS.ctl.signal,cache:false});const items=aiCheck(obj(r).ops);
  ADS.aiSel={};items.forEach(x=>{ADS.aiSel[x.i]=!x.err&&x.op!='del'});ADS.aiRes={summary:String(obj(r).summary||''),items}}catch(e){ADS.aiErr=errTxt(e)}
 ADS.busy=false;ADS.ctl=null;render()}
function aiApply(){if(!canWrite())return;const L=arr((ADS.aiRes||{}).items).filter(x=>!x.err&&ADS.aiSel[x.i]);let n=0;
 const bool=v=>v===true||v===1;
 L.forEach(x=>{const C=db[x.c];
  if(x.op=='set'){const it=C.find(y=>y.id==x.id);if(!it)return;Object.entries(x.patch).forEach(([k,v])=>{it[k]=['paid','free'].includes(k)?bool(v):['fam','nosplit'].includes(k)?(bool(v)?1:0):v});n++}
  else if(x.op=='add'){const pre={members:'m',trips:'t'}[x.c]||x.c+'-';C.push({...x.item,id:pre+uid()});n++}
  else if(x.op=='del'){const i=C.findIndex(y=>y.id==x.id);if(i>=0){if(COLL.includes(x.c))imgDel(C[i].orderNo);C.splice(i,1);n++}}});
 applyDb(db);ADS.aiRes=null;ADS.ai='';cloudSave();tip('已套用 '+n+' 項變更');render()}

const bkPack=()=>JSON.stringify({stob:1,format:1,at:new Date().toISOString(),db});
const bkCount=o=>({trips:arr(o.trips).length,members:arr(o.members).length,orders:COLL.reduce((a,k)=>a+arr(o[k]).length,0),fl:arr(o.fl).length,ht:arr(o.ht).length,tr:arr(o.tr).length,ot:arr(o.ot).length,plans:Object.keys(obj(o.plans)).length});
function bkCheck(txt){const R={errs:[],warns:[],data:null};let o;const t=String(txt||'').trim();if(!t){R.errs.push('還沒貼上備份內容');return R}
 try{o=JSON.parse(t)}catch(e){R.errs.push('不是完整的備份資料（可能沒複製完整，結尾少了括號）');return R}
 if(o&&o.stob&&o.db)o=o.db;
 if(!o||typeof o!='object'||Array.isArray(o)){R.errs.push('格式不對：最外層要是 {…}');return R}
 const K=['members','trips',...COLL];if(!K.some(k=>Array.isArray(o[k]))){R.errs.push('裡面沒有旅程、成員或訂單，不像是偏航的備份');return R}
 const ids=new Set();K.forEach(k=>{if(o[k]===undefined)return;if(!Array.isArray(o[k])){R.errs.push(CNAME[k]+'的格式不對');return}
  o[k].forEach((x,i)=>{if(!x||typeof x!='object'||Array.isArray(x)){R.errs.push(CNAME[k]+'第 '+(i+1)+' 筆格式不對');return}if(typeof x.id!='string'||!x.id){R.errs.push(CNAME[k]+'第 '+(i+1)+' 筆缺少 id');return}if(ids.has(x.id))R.errs.push('有重複的 id：'+x.id);ids.add(x.id)})});
 if(R.errs.length)return R;
 const tids=new Set(arr(o.trips).map(t=>t.id)),mids=new Set(arr(o.members).map(m=>m.id));
 const orph=COLL.reduce((a,k)=>a+arr(o[k]).filter(x=>!tids.has(x.trip)).length,0);if(orph)R.warns.push(orph+' 筆訂單找不到所屬旅程（還原後不會顯示在任何旅程）');
 let mm=0;arr(o.fl).forEach(f=>Object.keys(obj(f.pax)).forEach(i=>{if(!mids.has(i))mm++}));arr(o.ht).forEach(h=>arr(h.rooms).forEach(r=>arr(r.members).forEach(i=>{if(!mids.has(i))mm++})));if(mm)R.warns.push(mm+' 處旅客找不到對應的成員');
 const bad=K.filter(k=>Array.isArray(o[k])).flatMap(k=>o[k].flatMap(x=>Object.entries(x).filter(([f,v])=>FLD[k][f]!==undefined&&f!='trip'&&f!='rep'&&!['pax','pp','rooms'].includes(f)&&vField(k,f,v)).map(([f])=>CNAME[k]+'「'+(itemName(k,x)||x.id)+'」的'+FLD[k][f])));
 if(bad.length)R.warns.push('有 '+bad.length+' 個欄位格式怪怪的（例如 '+bad.slice(0,3).join('、')+'），仍可還原，請之後再檢查');

const PL={busy:'',err:'',ctl:null,ask:{},conf:false,edit:'',dl:null,chk:null,pal:{},out:null};

const addD=(x,n)=>{const t=pd(x);t.setDate(t.getDate()+n);return t.toLocaleDateString('sv-SE')};

/* 同行者：依成員生日自動整理 */
function whoAuto(t){const ms=people(t.id).map(M).filter(Boolean),on=t.start||new Date().toLocaleDateString('sv-SE');if(!ms.length)return '';
 const ag=ms.map(m=>m.dob?parseInt(ageAt(m.dob,on)):null),kid=ag.filter(a=>a!=null&&a<18),old=ag.filter(a=>a!=null&&a>=65);
 return `共 ${ms.length} 人`+(kid.length?`，小孩 ${kid.length} 位（${kid.sort((a,b)=>a-b).join('、')} 歲）`:'')+(old.length?`，65 歲以上 ${old.length} 位`:'')}
/* 每晚住宿（依目前勾選採用的飯店／露營車／郵輪） */
function nightStay(t){const H=db.ht.filter(h=>h.trip==t.id&&okH(h)).concat(CAMP.filter(c=>c.trip==t.id&&campOn(c))),m={};
 tDays(t).forEach(x=>{const on=H.filter(h=>h.cin<=x&&x<h.cout);if(on.length){const h=on[0];m[x]={name:h.zh||h.en,en:h.en||'',area:hArea(h)||h.area||'',addr:h.addr||''}}});return m}
function planCtx(t){const P=plOf(t.id).prefs||{},ns=nightStay(t);
 const fl=db.fl.filter(f=>f.trip==t.id&&okF(f)).flatMap(f=>f.segs.filter(s=>s.dir!='預期不飛').map(s=>({航段:s.dir,航班:(s.airline||f.airline||'')+' '+s.no,日期:s.date,起飛:s.dep,抵達:s.arr,從:s.from,到:s.to})));

同行者：${P.who||whoAuto(t)||'未填'}
步調：${P.pace||'適中'}
想去／必去：${P.must||'（沒有指定）'}
不想去／要避開：${P.avoid||'（沒有）'}
飲食：${P.food||'（沒有特別要求）'}
其他要求：${P.note||'（沒有）'}
已訂航班：${fl.length?JSON.stringify(fl):'（沒有）'}
每晚住宿：${Object.keys(ns).length?JSON.stringify(ns):'（還沒訂住宿，請依旅程名稱與偏好假設合理的住宿區域，並在 tips 提醒建議住哪一區）'}
已訂交通／門票／餐廳：${tr.length?JSON.stringify(tr):'（沒有）'}`}
const PLAN_FMT=`回傳 JSON（只回傳 JSON，全部用繁體中文）：
{"title":"行程標題","summary":"兩三句話說明整體安排","tips":["交通卡、預約、天氣、注意事項等實用提醒，3–6 點"],

   "items":[{"time":"09:00","title":"地點或活動名稱","detail":"做什麼、看什麼、建議停留多久、小提醒（1–2 句）","move":"從上一個點怎麼過去、約多久","q":"Google 地圖搜尋字（名稱＋城市）","booked":false,"cost":"大約費用（可空）"}]}]}`;
const PLAN_RULES=`排行程規則：
- 每一天都要有（從出發日到回程日），items 依時間排序，包含早餐以外的午餐、晚餐建議。
- 「已訂」的航班、交通、門票、餐廳一定要排在正確的日期與時間，booked 設為 true，不能改動。
- 抵達日：落地後約 1.5 小時（入境、領行李）才開始活動，第一站通常是先到住宿寄放行李；回程日：國際線起飛前 2.5 小時要到機場。
- 景點盡量排在當晚住宿附近或順路，避免來回折返；換住宿的那天要排移動。
- 依同行者調整：有小孩或長輩就放慢步調、安排休息，避免太長的步行。
- 不要編造不存在的地方；不確定營業時間的，在 detail 提醒「出發前確認」。`;

 try{PL.ctl=new AbortController();const r=obj(await CLD.sample.json(`你是專業的旅遊行程規劃師。請依下面的資料，排出這趟旅程每天的建議行程。\n\n${planCtx(t)}\n\n${PLAN_RULES}\n\n${PLAN_FMT}`,{signal:PL.ctl.signal,cache:false}));
  if(!arr(r.days).length)throw {code:'invalid_json'};plOf(tid).plan=plNorm(r,t);plOf(tid).at=Date.now();plSave();setTimeout(function(){tip('一切都安排好了，現在可以亂來了。')},60)}
 catch(e){PL.err=plErr(e)}PL.busy='';PL.ctl=null;render()}
function plNorm(r,t){const ns=nightStay(t),days=arr(r.days).map(d0=>({date:String(d0.date||''),title:String(d0.title||''),area:String(d0.area||''),hotel:String(d0.hotel||''),items:arr(d0.items).map(i=>({time:String(i.time||''),title:String(i.title||''),detail:String(i.detail||''),move:String(i.move||''),q:String(i.q||i.title||''),booked:!!i.booked,cost:String(i.cost||'')}))}));
 days.forEach(x=>{if(ns[x.date])x.hotel=ns[x.date].name});const td=tDays(t),days2=td.length?days.filter(x=>td.includes(x.date)):days;days.length=0;days.push(...days2);days.sort((a,b)=>a.date.localeCompare(b.date));

 try{PL.ctl=new AbortController();const r=obj(await CLD.sample.json(`你是專業的旅遊行程規劃師。請重新安排 ${cur.date} 這一天的行程，${ask?'使用者的要求：'+ask:'給一個不同的建議（換掉大部分非已訂的點）'}。\n\n${planCtx(t)}\n\n其他天已經安排（不要重複這些地點）：\n${others}\n\n這一天目前的安排：${JSON.stringify(cur)}\n\n${PLAN_RULES}\n\n只回傳這一天，JSON 格式：{"date":"${cur.date}","title":"","area":"","hotel":"","items":[{"time":"","title":"","detail":"","move":"","q":"","booked":false,"cost":""}]}`,{signal:PL.ctl.signal,cache:false}));

 catch(e){PL.err=plErr(e)}PL.busy='';PL.ctl=null;render()}

/* ---------- PDF：用 canvas 直接畫文字（各瀏覽器都可用）→ A4 JPEG 頁 → 自製 PDF ---------- */
function pdfBuild(pages){/* pages: [{jpg:Uint8Array,w,h}]，A4 595×842pt */
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;const put=b=>{if(typeof b=='string')b=enc.encode(b);parts.push(b);len+=b.length};
 put('%PDF-1.4\n');const n=pages.length,obj=(i,body)=>{offs[i]=len;put(i+' 0 obj\n');body();put('\nendobj\n')};
 obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>put('<< /Type /Pages /Count '+n+' /Kids ['+pages.map((p,i)=>(3+i*3)+' 0 R').join(' ')+'] >>'));
 pages.forEach((p,i)=>{const pg=3+i*3,ct=pg+1,im=pg+2,cmd='q 595 0 0 842 0 0 cm /Im0 Do Q';
  obj(pg,()=>put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>'));
  obj(ct,()=>put('<< /Length '+cmd.length+' >>\nstream\n'+cmd+'\nendstream'));
  obj(im,()=>{put('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n');put(p.jpg);put('\nendstream')})});
 const xo=len,tot=3+n*3;put('xref\n0 '+tot+'\n0000000000 65535 f \n');for(let i=1;i<tot;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 put('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}

function pdfView(urls,name){let e=document.getElementById('pdfv');if(!e){e=document.createElement('div');e.id='pdfv';e.className='pdfv';document.body.appendChild(e)}

async function plPdf(){const tid=oneT(),t=T(tid),pl=plOf(tid).plan;if(!pl||PL.dl)return;PL.dl=1;render();let stage='layout',pages=[];
 try{await new Promise(r=>setTimeout(r,30));pages=plPages(t,pl);stage='encode';
  const out=[];for(const c of pages){const b=await toBlob(c,'image/jpeg',.85);if(!b)throw {code:'encode'};out.push({jpg:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height})}
  const pdf=pdfBuild(out),name=t.name.replace(/^\d{6}/,'')+'-建議行程.pdf';stage='save';
  let dls=null;try{dls=await claude.use('downloads')}catch(e){}
  if(!dls){pdfView(pages.map(c=>c.toDataURL('image/jpeg',.85)),name);throw {code:'shown'}}
  try{await dls.save({filename:name,data:pdf});tip('PDF 已儲存')}
  catch(e){const k=e&&e.code;if(k=='declined')throw e;pdfView(pages.map(c=>c.toDataURL('image/jpeg',.85)),name);throw {code:'shown',why:k}}}
 catch(e){const k=e&&e.code;if(k!='declined'&&k!='shown')tip('PDF 製作失敗（'+stage+(k?'・'+k:'')+'），請再試一次');if(k=='shown')tip('這個畫面無法下載，已改成圖片顯示'+(e.why?'（'+e.why+'）':''))}
 PL.dl=null;render()}

 const fl=db.fl.filter(f=>f.trip==t.id&&live(f)&&okF(f)),ht=db.ht.filter(h=>h.trip==t.id&&live(h)&&okH(h)).sort(hSort);

 const sm=new Map();fl.forEach(f=>f.segs.filter(s=>s.dir!='預期不飛').forEach(s=>{const k=[s.date,s.dep,s.no].join('|');if(!sm.has(k))sm.set(k,{s,air:s.airline||f.airline||'',L:[]});sm.get(k).L.push(f)}));
 const segs=[...sm.values()].sort((a,b)=>((a.s.date||'')+(a.s.dep||'')).localeCompare((b.s.date||'')+(b.s.dep||'')));
 const pnrs=f=>{const by=new Map();Object.keys(f.pax).filter(M).forEach(i=>{const p=(f.pp&&f.pp[i])||{},k=p.pnr||f.pnr||'';if(!by.has(k))by.set(k,[]);by.get(k).push(i)});return [...by]};
 return {segs,hg:grp(ht,hKey),tr,pnrs}}

 --hero-bg:linear-gradient(125deg,#3A1820,#2A1519);--hero-img:none;--hero-veil:none;--hero-text:#FFE3E0;--hero-sub:#E9CFCF;--hero-em:#E3BD85;--lg-bg:#7A1F2C}

/* 底色：頂端一抹柔光 */
html{background-color:rgb(var(--s50))!important;background-image:radial-gradient(120% 40% at 50% -8%,rgb(var(--sun)/var(--sunA)),transparent 70%)!important;background-repeat:no-repeat!important}

/* 字體：標題與數字用襯線 */
h1,h2,.text-2xl,.sr{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC",serif!important}
.adhero h3,.adsteps b,.pldn{font-family:"Noto Serif TC","Songti TC",serif!important;font-weight:600}
h2.sr{display:flex;align-items:center;gap:.7rem;letter-spacing:.05em}
h2.sr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgb(var(--tag)),rgb(var(--tag)/0))}

/* 卡片、按鈕：柔光 */
.bg-card{border-color:rgb(var(--s200))!important;border-radius:1.15rem!important;box-shadow:0 1px 2px rgb(var(--shd)/.05),0 16px 32px -20px rgb(var(--shd)/.38)!important}
.bg-stone-700{box-shadow:0 8px 18px -10px rgb(var(--gold)/.7)}
.upfab{background:linear-gradient(135deg,rgb(var(--acc2)),rgb(var(--acc)))!important;color:rgb(var(--fcon))!important;box-shadow:0 12px 26px -10px rgb(var(--acc)/.6)!important}
.sx-h{background:linear-gradient(135deg,var(--sxh1),var(--sxh2))!important;color:#fff}
.plbk{background:rgb(var(--tag)/.3)!important}

/* 頁首標誌 */
.stm.dtl{width:2.9rem;height:2.9rem;padding:0;background:none;border-radius:22%;clip-path:none;transform:none;filter:none;box-shadow:0 8px 16px -8px rgb(var(--shd)/.55)}
.stm.dtl svg{width:100%;height:100%;display:block}
.th-n{display:none!important}
[data-theme="navy"] .th-n{display:block!important}
[data-theme="navy"] .th-r{display:none!important}
.th-r,.th-n{display:block}
.stw b{font-family:"Noto Serif TC","Songti TC",serif!important;font-weight:600;font-size:1.7rem;letter-spacing:.18em;color:rgb(var(--s900))}
.stw small{margin-top:.28rem;font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:600;font-size:.78rem;letter-spacing:.26em;color:rgb(var(--goldt));opacity:1;text-transform:uppercase}
.stw small em{font-style:normal;letter-spacing:.12em;margin-left:.45em;padding:0 .4em;border-radius:99px;background:rgb(var(--tag)/.38);color:rgb(var(--tagt));font-size:.7rem;text-transform:none}
@media (prefers-color-scheme: dark){.stw small em{color:rgb(var(--tag));background:rgb(var(--tag)/.16)}}

/* 首頁標語卡 */
.dtr-hero{position:relative;overflow:hidden;margin:.3rem 0 1.1rem;padding:1.35rem 1.2rem 1.3rem;border-radius:1.4rem;background:var(--hero-veil),var(--hero-img) right bottom/cover no-repeat,var(--hero-bg);min-height:15.5rem;padding-bottom:4.2rem;border:1px solid var(--hero-edge);box-shadow:0 18px 36px -24px rgb(var(--shd)/.55)}
.dtr-hero>*{position:relative}
.dtr-fl{display:none;position:absolute!important;right:.5rem;top:.55rem;width:40%;max-width:13rem;height:auto;pointer-events:none}
.dtr-fl svg{display:block;width:100%;height:auto}
.dtr-g{display:inline-block;padding-left:.6rem;border-left:2px solid rgb(var(--tag));font-size:.82rem;line-height:1.2;letter-spacing:.1em;color:var(--hero-sub)}
.dtr-t{margin:.95rem 0 .6rem;font-family:"Noto Serif TC","Songti TC",serif;font-weight:600;font-size:1.5rem;line-height:1.5;letter-spacing:.04em;color:var(--hero-text)}
.dtr-t em{font-style:normal;color:var(--hero-em);border-bottom:1px solid var(--hero-em)}
.dtr-en{margin-top:1.1rem;font-family:"Playfair Display","Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:1rem;letter-spacing:.04em;color:var(--hero-sub)}
/* 頁尾：星、台詞、版本 */
.dtr-foot{margin:1.9rem 0 .4rem;text-align:center;color:rgb(var(--s500))}
.dtr-foot svg{width:1.1rem;height:1.1rem;display:block;margin:0 auto .4rem}
.dtr-foot p{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:.92rem;letter-spacing:.08em}
.dtr-ver{display:inline-block;margin-top:.7rem;padding:.2rem .8rem;border:1px solid rgb(var(--tag)/.8);border-radius:99px;background:transparent;font:600 .82rem "Cormorant Garamond","Noto Serif TC",serif;letter-spacing:.14em;color:rgb(var(--goldt));cursor:pointer}
.dtr-alt{margin-top:.4rem;text-align:right;font-family:"Noto Serif TC","Songti TC",serif;font-size:.78rem;letter-spacing:.06em;color:rgb(var(--s500))}

/* 管理 › 關於 */
.dtr-ab h3{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:1.3rem;letter-spacing:.12em}
.dtr-ab .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;color:rgb(var(--goldt));letter-spacing:.06em}
.dtr-vr{margin:1rem 0 0;padding:0;list-style:none;border-left:1px solid rgb(var(--tag))}
.dtr-vr>li{position:relative;margin:0 0 1rem;padding-left:1.1rem}
.dtr-vr>li::before{content:"";position:absolute;left:-.34rem;top:.5rem;width:.62rem;height:.62rem;border-radius:50%;background:rgb(var(--tag));box-shadow:0 0 0 3px rgb(var(--card))}
.dtr-vr>li.cur::before{background:rgb(var(--gold))}
.dtr-vr b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-size:1.1rem;color:rgb(var(--goldt))}
.dtr-vr small{margin-left:.5rem;color:rgb(var(--s500))}
.dtr-vr ul{margin:.3rem 0 0;padding-left:1.1rem;font-size:.88rem;line-height:1.6;color:rgb(var(--s700))}

/* 管理 › 外觀設定 */
.dtr-th{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.dtr-tb{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;padding:.85rem;border-radius:1rem;border:1.5px solid rgb(var(--s300));background:rgb(var(--card));color:rgb(var(--s900));text-align:left;cursor:pointer}
.dtr-tb[aria-checked="true"]{border-color:rgb(var(--acc));box-shadow:0 0 0 2px rgb(var(--acc)/.25)}
.dtr-tb b{font-family:"Noto Serif TC","Songti TC",serif;font-size:1.05rem}
.dtr-tb small{font-size:.76rem;line-height:1.4;color:rgb(var(--s500))}
.dtr-sw{display:flex}.dtr-sw i{width:1.5rem;height:1.5rem;border-radius:50%;margin-right:-.4rem;border:2px solid rgb(var(--card))}
.dtr-romantic .dtr-sw i:nth-child(1){background:#7A1F2C}.dtr-romantic .dtr-sw i:nth-child(2){background:#F7E6E8}.dtr-romantic .dtr-sw i:nth-child(3){background:#C9A06A}
.dtr-navy .dtr-sw i:nth-child(1){background:#0D2B52}.dtr-navy .dtr-sw i:nth-child(2){background:#1E4A7C}.dtr-navy .dtr-sw i:nth-child(3){background:#D6B273}
.dtr-vr summary{cursor:pointer;list-style:none;padding:.1rem 0}
.dtr-vr summary::-webkit-details-marker{display:none}
.dtr-vr summary:focus-visible{outline:2px solid rgb(var(--gold));outline-offset:2px}
.dtr-vr ul ul,.dtr-vr details>ul{list-style:disc}
.dtr-vr details>ul>li{margin:.15rem 0}
@media (prefers-color-scheme: dark){[data-theme="romantic"] .dtr-fl,:root:not([data-theme]) .dtr-fl{display:block}}
.stm.dtl img{display:block;width:100%;height:100%;border-radius:22%}
.dtr-hero .dtr-g,.dtr-hero .dtr-en{text-shadow:0 0 .6rem rgb(255 255 255/.0)}
</style></body></html>
