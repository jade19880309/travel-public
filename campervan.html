let done={};try{done=JSON.parse(localStorage.getItem('dn')||'{}')}catch(e){}
function day(L,k,i){const[t,rows,inf,note]=L[k];const a=t.split('｜')[0],b=t.split('｜').slice(1).join('｜');
return `<section id="d${i}"><h2><span class="tag">${a}</span>${b}</h2><div class="card">${rows.map((r,j)=>`<div class="tl ${done[k+j]?'ok':''}" data-k="${k+j}"><i></i><span class="t">${r[0]}</span><span class="x">${r[1]}</span></div>`).join('')}</div><div class="sp"></div><div class="card">${kv(inf)}</div>${note?`<p class="note">${note}</p>`:''}${k=='d3'?`<div class="sp"></div><h2><small>${L.ykh}</small></h2><div class="card"><ul>${L.yk.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}</section>`}
function render(){const L=D[lang],u=U[lang];document.documentElement.lang=lang=='ja'?'ja':'zh-Hant';
$('#ti').textContent=L.title;$('#su').textContent=L.sub;$('#de').textContent=L.desc;
document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));
const ids=['b','p','d1','d2','d3','d4','mp'];$('#nav').innerHTML=u.nav.map((n,i)=>`<a href="#${ids[i]}">${n}</a>`).join('');
$('#m').innerHTML=`<section id="b"><h2>${L.h1a.replace(/^.、/,'')}</h2><div class="card">${kv(L.basic)}</div><div class="sp"></div><div class="card fw"><table class="fl"><tr>${L.fh.map(h=>`<th>${h}</th>`).join('')}</tr>${L.frows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></section>
<section id="p"><h2>${L.h1b.replace(/^.、/,'')}</h2><div class="card"><ul>${L.princ.map(x=>`<li>${x}</li>`).join('')}</ul></div><p class="hint">${u.hint}</p></section>
${['d1','d2','d3','d4'].map((k,i)=>day(L,k,i+1)).join('')}
<section id="mp"><h2>${L.h3.replace(/^.、/,'')}</h2><div class="card fw"><table class="st"><tr>${L.mh.map(h=>`<th>${h}</th>`).join('')}</tr>${L.mrows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div><p class="note">${L.mnote}</p><img class="map" src="${IMG[lang]}" alt="${L.hmap}"><p class="hint">${L.cap}　${u.mapz}</p></section>`;
document.querySelectorAll('.tl').forEach(e=>e.onclick=()=>{e.classList.toggle('ok');done[e.dataset.k]=e.classList.contains('ok')?1:0;try{localStorage.setItem('dn',JSON.stringify(done))}catch(x){}});
$('.map').onclick=e=>{$('#zm img').src=e.target.src;$('#zm').style.display='block'};spy()}
$('#zm').onclick=()=>$('#zm').style.display='none';
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lg',lang)}catch(e){}render()});
let cur='',tk=0;function spy(){cur='';upd()}function upd(){const ss=[...document.querySelectorAll('main section')];let c=ss[0];const y=(document.querySelector('.bar').offsetHeight||60)+40;ss.forEach(s=>{if(s.getBoundingClientRect().top<=y)c=s});if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)c=ss[ss.length-1];if(c.id==cur)return;cur=c.id;const n=$('#nav');n.querySelectorAll('a').forEach(a=>{const on=a.getAttribute('href')=='#'+c.id;a.classList.toggle('on',on);if(on)n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.offsetWidth/2,behavior:'smooth'})})}addEventListener('scroll',()=>{if(!tk){tk=1;requestAnimationFrame(()=>{tk=0;upd()})}},{passive:true});
render();
</script></body></html>
