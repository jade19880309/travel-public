<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<!-- 港珠澳封面插畫：黃昏海面、港珠澳大橋、澳門與香港天際線 -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26315c"/><stop offset=".38" stop-color="#7d4a78"/><stop offset=".62" stop-color="#e2876a"/><stop offset=".78" stop-color="#f6c48d"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a27d"/><stop offset=".25" stop-color="#8a5b78"/><stop offset="1" stop-color="#1d2a4d"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3d1"/><stop offset=".55" stop-color="#ffd58e"/><stop offset="1" stop-color="#ffb26b" stop-opacity="0"/></radialGradient>
<linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d5f86"/><stop offset="1" stop-color="#b8737c"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g fill="#fff" opacity=".7"><circle cx="140" cy="90" r="1.6"/><circle cx="320" cy="60" r="1.2"/><circle cx="520" cy="110" r="1.4"/><circle cx="980" cy="70" r="1.5"/><circle cx="1110" cy="140" r="1.2"/><circle cx="760" cy="40" r="1.1"/></g>
<circle cx="760" cy="560" r="150" fill="url(#sun)"/>
<circle cx="760" cy="560" r="58" fill="#fff0c9"/>
<!-- 遠山 -->
<path d="M0 600 C90 560 160 540 240 556 C320 572 380 520 470 530 C560 540 600 590 700 590 C820 590 880 540 980 548 C1080 556 1140 590 1200 600 L1200 640 L0 640 Z" fill="url(#far)" opacity=".75"/>
<!-- 海 -->
<rect y="620" width="1200" height="280" fill="url(#sea)"/>
<g stroke="#ffe2b0" stroke-width="3" stroke-linecap="round" opacity=".55"><path d="M700 650h120M690 672h140M712 696h96M724 722h72M736 750h48"/></g>
<g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".18"><path d="M80 700h90M260 760h120M480 690h70M960 720h110M1040 800h90M180 840h120"/></g>
<!-- 左：澳門（新葡京蓮花造型＋大三巴牌坊） -->
<g fill="#3a2440">
<path d="M150 620 L150 470 C150 440 170 420 186 410 C202 420 222 440 222 470 L222 620 Z"/>
<path d="M186 410 C170 380 172 350 186 318 C200 350 202 380 186 410 Z"/>
<path d="M140 470 C120 440 128 410 150 392 C152 420 160 445 176 462 Z M232 470 C252 440 244 410 222 392 C220 420 212 445 196 462 Z"/>
<rect x="60" y="560" width="70" height="60"/><rect x="236" y="540" width="56" height="80"/><rect x="292" y="572" width="40" height="48"/>
<!-- 大三巴 -->
<path d="M352 620 V520 H372 V500 H392 V476 L404 462 L416 476 V500 H436 V520 H456 V620 Z"/>
</g>
<g fill="#f6c48d" opacity=".55"><rect x="380" y="530" width="8" height="14" rx="4"/><rect x="398" y="530" width="12" height="18" rx="6"/><rect x="420" y="530" width="8" height="14" rx="4"/><rect x="398" y="490" width="12" height="12" rx="6"/></g>
<!-- 右：香港天際線 -->
<g fill="#33284a">
<rect x="930" y="520" width="34" height="100"/><rect x="968" y="470" width="30" height="150"/><path d="M1004 620 V430 L1022 400 L1040 430 V620 Z"/><rect x="1046" y="500" width="36" height="120"/><rect x="1086" y="455" width="28" height="165"/><rect x="1118" y="530" width="40" height="90"/><rect x="1160" y="490" width="40" height="130"/><rect x="890" y="560" width="36" height="60"/>
</g>
<g fill="#ffd58e" opacity=".55"><rect x="975" y="490" width="4" height="4"/><rect x="986" y="510" width="4" height="4"/><rect x="1014" y="460" width="4" height="4"/><rect x="1026" y="490" width="4" height="4"/><rect x="1094" y="480" width="4" height="4"/><rect x="1056" y="520" width="4" height="4"/><rect x="1170" y="510" width="4" height="4"/></g>
<!-- 港珠澳大橋 -->
<path d="M0 668 C220 640 420 628 600 630 C800 632 1000 646 1200 664" fill="none" stroke="#2a2140" stroke-width="10"/>
<path d="M0 676 C220 648 420 636 600 638 C800 640 1000 654 1200 672" fill="none" stroke="#f3c27f" stroke-width="2" opacity=".6"/>
<g stroke="#2a2140" stroke-width="3" opacity=".9">
<path d="M0 670v40M60 664v42M120 658v44M180 652v46M240 647v48M300 643v48M360 639v50M420 636v50M480 634v52M540 632v52M660 632v52M720 633v52M780 635v50M840 637v50M900 640v48M960 644v48M1020 648v46M1080 653v44M1140 658v42"/>
</g>
<!-- 中國結造型橋塔與斜拉索 -->
<g fill="none" stroke="#2a2140" stroke-width="7" stroke-linecap="round">
<path d="M530 632 V520 M570 632 V520"/>
<path d="M530 540 L570 580 M570 540 L530 580"/>
</g>
<g stroke="#2a2140" stroke-width="1.6" opacity=".75"><path d="M550 524 L430 636M550 524 L460 635M550 524 L490 634M550 524 L670 632M550 524 L640 632M550 524 L610 631"/></g>
<rect x="526" y="514" width="48" height="10" rx="3" fill="#2a2140"/>
<!-- 飛鳥 -->
<g fill="none" stroke="#2a2140" stroke-width="2.4" stroke-linecap="round" opacity=".7"><path d="M640 300q10-10 20 0q10-10 20 0"/><path d="M700 340q7-7 14 0q7-7 14 0"/><path d="M600 360q6-6 12 0q6-6 12 0"/></g>
</svg>
