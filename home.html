<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#14110f"><title>2027 家庭旅行手帖</title><meta name="description" content="首爾春節・香港珠海澳門・東京富士山｜全家 2027 的旅程都在這裡"><meta property="og:type" content="website"><meta property="og:site_name" content="家庭旅遊行程"><meta property="og:title" content="2027 家庭旅行手帖"><meta property="og:description" content="首爾春節・香港珠海澳門・東京富士山｜全家 2027 的旅程都在這裡"><meta property="og:url" content="https://jade19880309.github.io/travel-public/home.html"><meta property="og:image" content="https://jade19880309.github.io/travel-public/images/og-home-2027b.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="manifest" href="manifest-home.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="旅行手帖"><link rel="apple-touch-icon" href="icon-home-180.png"><link rel="icon" href="icon-home-192.png"><link rel="stylesheet" href="journal-v4.css"></head><body>
<!-- 家庭旅行手帖 V4（images/journal-v4/ 素材）。V3 備份：backups/home-before-v4-20261126.html -->
<header class="cover"><img class="cover-art" src="images/journal-v4/hero-landscape.webp" alt="" width="1520" height="241"><div class="cover-copy"><div class="script">Family Travel Journal</div><h1><img src="images/journal-v4/title-cut.webp" alt="家庭旅行手帖" width="727" height="189"></h1><p class="slogan">一起出發，<br>把日子過成風景。</p><img class="year" src="images/journal-v4/year-tag-cut.webp" alt="2027" width="398" height="180"></div></header>
<main class="wrap"><div class="journal" id="up"></div><noscript><p><a href="./?t=seoul-2027">首爾</a> · <a href="hk.html">港珠澳</a> · <a href="tokyo.html">東京</a> · <a href="campervan.html">露營車旅行</a></p></noscript></main>
<footer><div class="forest"><img src="images/journal-v4/footer-original-cut.webp" alt="" width="2172" height="724"><span class="sign" aria-hidden="true"><i>Family</i><i>Trip ♥</i></span></div><div class="foot"><span>點卡片進入行程・可加入主畫面離線查看</span><button data-upd>檢查更新</button></div></footer><script>
const D={'seoul-2027':['首爾','Seoul','冬日新春・韓國家族旅行','seoul','blue'],'hk-2027':['港珠澳','HK · Zhuhai · Macau','港城光影・一程三地','hk','red'],'tokyo-2027':['東京','Tokyo','盛夏東京・城市與自然漫遊','tokyo','green']};const fallback=[{id:'seoul-2027',url:'./?t=seoul-2027',start:'2027-02-03',end:'2027-02-08'},{id:'hk-2027',url:'hk.html',start:'2027-04-03',end:'2027-04-06'},{id:'tokyo-2027',url:'tokyo.html',start:'2027-07-02',end:'2027-07-07'}];const A='images/journal-v4/',TAPE={seoul:'blue',hk:'pink',tokyo:'green'};
// 倒數邏輯與 V3 相同（cdStart/cdEnd），只把數字包成 <b> 以配合筆刷標籤
function status(t){const n=Date.now(),s=Date.parse(t.start+'T00:00:00+08:00'),cs=Date.parse(t.cdStart||t.start+'T00:00:00+08:00'),e=Date.parse(t.cdEnd||t.end+'T23:59:59+08:00');return n>e?'已完成・回憶':n>=cs?'旅程進行中・第 <b>'+Math.max(1,Math.floor((n-s)/86400000)+1)+'</b> 天':'還有 <b>'+Math.ceil((s-n)/86400000)+'</b> 天'}
function render(list){document.querySelector('#up').innerHTML=list.filter(t=>D[t.id]).sort((a,b)=>a.start.localeCompare(b.start)).map((t,i)=>{const d=D[t.id],k=d[3],f=s=>s.slice(5).replace('-','.');return `<article class="entry t-${k}${i%2?' alt':''}"><img class="stack" src="${A}paper-stack-cut.webp" alt=""><img class="tape" src="${A}tape-${TAPE[k]}-cut.webp" alt=""><a class="entry-main" href="${t.url}"><img class="card" src="${A+k}-cut.webp" alt="" width="${k==='hk'?515:k==='tokyo'?511:507}" height="436"><div class="info"><div class="date"><img class="cal" src="images/journal-v3/deco-cal-${k}.png" alt="" width="17" height="16">${f(t.start)} – ${f(t.end)}</div><div class="name"><h2>${d[0]}</h2><span class="en">${d[1]}</span></div><p>${d[2]}</p><div class="status"><img src="${A}brush-${d[4]}-cut.webp" alt=""><span>${status(t)}</span></div></div><img class="mark" src="${A}landmark-${k}-cut.webp" alt=""><span class="arr" aria-hidden="true"></span></a>${t.id==='tokyo-2027'?`<a class="subtrip" href="campervan.html"><img src="${A}camper-ticket-cut.webp" alt="" width="549" height="251"><span>露營車旅行<small>（東京子項目）</small></span><b class="chev" aria-hidden="true"></b></a>`:''}</article>`}).join('')}
render(fallback);fetch('trips/index.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(render).catch(()=>{});if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="upd.js"></script></body></html>
